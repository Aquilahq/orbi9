function normalize(p){return {...seed,...p,variants:{...seed.variants,...(p.variants||{})},seo:{...seed.seo,...(p.seo||{})}}}function load(){try{const a=JSON.parse(localStorage.getItem(KEY));products=Array.isArray(a)&&a.length?a.map(normalize):[normalize(seed)];}catch{products=[normalize(seed)]}const requested=typeof window!=='undefined'?new URLSearchParams(location.search).get('product'):null;product=products.find(p=>p.id===requested||p.slug===requested)||products[0]}function createProduct(){const id='orbi9-product-'+Date.now();const fresh=normalize({...seed,id,name:'New product',slug:'new-product-'+Date.now(),images:[]});products.unshift(fresh);product=fresh;dirty=true;imageIndex=0;renderProductBrowser();renderNav();renderEditor();renderPreview();$('saveState').textContent='Unsaved changes'}function deleteProduct(){if(!product||!confirm(`Delete ${product.name}? This cannot be undone.`))return;products=products.filter(p=>p.id!==product.id);product=products[0]||normalize({...seed,id:'orbi9-product-'+Date.now(),name:'New product',slug:'new-product'});dirty=true;localStorage.setItem(KEY,JSON.stringify(products));renderProductBrowser();renderNav();renderEditor();renderPreview();$('saveState').textContent=products.length?'Saved':'Unsaved changes'}function renderProductBrowser(filter=''){const box=$('productBrowser');if(!box)return;const matches=products.filter(p=>p.name.toLowerCase().includes(filter.toLowerCase()));box.innerHTML=`<div class="product-browser-label"><span>Products</span><button id="addProduct" class="icon" title="Add product">＋</button></div><input class="product-search" id="productSearch" placeholder="Search products…" aria-label="Search products"> <div class="product-list">${matches.map(p=>`<button class="product-choice ${p.id===product.id?'selected':''}" data-product-id="${p.id}">${p.name||'Untitled product'}</button>`).join('')||'<span class="help">No products found</span>'}</div>`;$('productSearch').value=filter;$('productSearch').oninput=e=>renderProductBrowser(e.target.value);$('addProduct')?.addEventListener('click',createProduct);box.querySelectorAll('[data-product-id]').forEach(b=>b.onclick=()=>{if(dirty&&!confirm('Discard unsaved changes?'))return;product=products.find(p=>p.id===b.dataset.productId)||product;dirty=false;imageIndex=0;renderProductBrowser($('productSearch').value);renderNav();renderEditor();renderPreview();$('saveState').textContent='Saved'})}
function setDirty(){dirty=true;$('saveState').textContent='Unsaved changes';$('saveState').className='save-state';clearTimeout(timer);timer=setTimeout(save,1500);renderPreview()}
function bind(id,path,number=false){const el=$(id);el.addEventListener('input',()=>{let o=product;for(let i=0;i<path.length-1;i++)o=o[path[i]];o[path.at(-1)]=number?(el.value===''?'':Number(el.value)):el.value;setDirty()});}
function field(label,id,value,type='text',extra=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${String(value??'').replaceAll('"','&quot;')}" ${extra}></div>`}

function optimizeImage(file,dataUrl){return new Promise(resolve=>{if(!file.type.startsWith('image/')||file.type==='image/svg+xml'||dataUrl.length<400000){resolve(dataUrl);return}const image=new Image();image.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(image.naturalWidth,image.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.82))};image.onerror=()=>resolve(dataUrl);image.src=dataUrl})}
function categoryField(value){const categories=[...new Set(['Accessories','Apparel','Collectibles','Electronics','Home',...products.map(p=>p.category).filter(Boolean)])].sort((a,b)=>a.localeCompare(b));if(value&&!categories.includes(value))categories.push(value);const quote=v=>String(v).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;');return `<div class="field"><label for="category">Category</label><select id="category"><option value="">Uncategorized</option>${categories.map(c=>`<option value="${quote(c)}" ${c===value?'selected':''}>${quote(c)}</option>`).join('')}<option value="__new__">＋ Add new category…</option></select></div>`}
function renderNav(){$('nav').innerHTML=sections.map((x,i)=>`<button class="navitem ${i===section?'active':''}" data-i="${i}">${x}${i===1?'<small>Inventory, variants, SEO & more</small>':''}</button>`).join('');document.querySelectorAll('.navitem').forEach(b=>b.onclick=()=>{section=+b.dataset.i;renderNav();renderEditor()})}

${product.continueSelling?'checked':''}> Continue selling when out of stock</label></div>`;if(i===4)h=`<div class="card form-card"><h3>Product description</h3><div class="field"><label for="description">Description</label><textarea id="description">${product.description||''}</textarea></div></div>`;if(i===5)h=`<div class="card form-card"><h3>Shipping</h3><label class="check field"><input id="physical" type="checkbox" ${product.physical?'checked':''}> Physical product</label>${field('Shipping profile','shippingProfile',product.shippingProfile)}<p class="help">Weight is managed in Inventory.</p></div>`;if(i===6)h=`<div class="card form-card"><h3>Options</h3><div id="options"></div><div class="row-actions"><button class="outline" id="addOption">＋ Add option</button><button class="outline" id="regen">Regenerate combinations</button></div><div class="variant-table" id="variants"></div></div>`;if(i===7)h=`<div class="card form-card"><h3>Search engine listing</h3>${field('SEO title','seoTitle',product.seo.title)}<div class="field"><label for="seoDescription">Meta description</label><textarea id="seoDescription">${product.seo.description||''}</textarea></div>${field('URL slug','seoSlug',product.seo.slug)}<div class="seo-preview"><b id="seoPrevTitle">${product.seo.title||product.name}</b><cite>orbi9.com/products/${product.seo.slug||slug(product.name)}</cite><p id="seoPrevDesc">${product.seo.description||product.description}</p></div></div>`;$('editor').innerHTML=h;wireEditor(i)}
function renderEditor(){if(section===0){$('panelTitle').textContent='Product';$('editor').innerHTML=`<div class="card form-card"><h3>Product details</h3>${field('Item name','name',product.name)}${categoryField(product.category||'')}<label class="toggle-field"><input id="featured" type="checkbox" ${product.featured?'checked':''}> <span>Featured item</span><small>Show a star on the storefront</small></label>${textareaField('Short description','subtitle',product.subtitle,'rows="3" placeholder="A concise summary shown on product cards."')}${textareaField('Long description','description',product.description,'rows="7" placeholder="Detailed product information shown on the product page."')}<div class="grid2">${field('Price','price',product.price,'number','step="0.01" min="0"')}</div></div><div class="card form-card"><h3>Product image</h3><div class="media-list" id="mediaList"></div><div class="upload"><label for="imageFiles">＋ Upload image</label><input id="imageFiles" type="file" accept="image/*" multiple><button class="outline" id="addUrl">Add image URL</button></div><p class="help">Images preview here immediately and are saved with this product.</p></div>`;wireEditor(0);return}renderAdvancedEditor();$('editor').insertAdjacentHTML('afterbegin',`<div class="advanced-picker"><label for="advancedSection">Advanced section</label><select id="advancedSection">${sections.slice(2).map((x,i)=>`<option value="${i+2}" ${advancedSection===i+2?'selected':''}>${x}</option>`).join('')}</select></div>`);$('advancedSection').onchange=e=>{advancedSection=+e.target.value;renderEditor()}}
function wireEditor(i){if(i===0){bind('name',['name']);$('featured').onchange=e=>{product.featured=e.target.checked;setDirty()};$('category').onchange=e=>{if(e.target.value==='__new__'){const value=prompt('New category name');if(value&&value.trim()){product.category=value.trim();setDirty();renderEditor()}else e.target.value=product.category||''}else{product.category=e.target.value;setDirty()}};bind('subtitle',['subtitle']);bind('description',['description']);bind('price',['price'],true);renderMedia();$('imageFiles').onchange=e=>[...e.target.files].forEach(file=>{const r=new FileReader();r.onload=async()=>{product.images.push(await optimizeImage(file,r.result));product.primaryImage=product.images.length-1;setDirty();renderEditor()};r.readAsDataURL(file)});$('addUrl').onclick=()=>{const u=prompt('Image URL');if(u){product.images.push(u);product.primaryImage=product.images.length-1;setDirty();renderEditor()}}}if(i===2){bind('price',['price'],true);bind('compareAtPrice',['compareAtPrice'],true);bind('costPerItem',['costPerItem'],true);$('taxable').onchange=()=>{product.taxable=$('taxable').checked;setDirty()}}if(i===3){bind('sku',['sku']);bind('quantity',['quantity'],true);bind('weight',['weight'],true);$('weightUnit').value=product.weightUnit;$('weightUnit').onchange=()=>{product.weightUnit=$('weightUnit').value;setDirty()};['trackInventory','continueSelling'].forEach(id=>$(id).onchange=()=>{product[id]= $(id).checked;setDirty()})}if(i===4){bind('description',['description'])}if(i===5){bind('shippingProfile',['shippingProfile']);$('physical').onchange=()=>{product.physical=$('physical').checked;setDirty()}}if(i===6)renderVariants();if(i===7){bind('seoTitle',['seo','title']);bind('seoDescription',['seo','description']);bind('seoSlug',['seo','slug'])}}
function renderMedia(){const list=$('mediaList');list.innerHTML=product.images.map((src,i)=>`<div class="media-item ${i===product.primaryImage?'primary-img':''}" data-i="${i}"><img src="${src}" alt=""><button data-remove="${i}">×</button><button class="main" data-primary="${i}">${i===product.primaryImage?'Primary':'Make primary'}</button></div>`).join('')||'<p class="help">No images yet.</p>';list.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{product.images.splice(+b.dataset.remove,1);product.primaryImage=Math.min(product.primaryImage,Math.max(0,product.images.length-1));setDirty();renderEditor()});list.querySelectorAll('[data-primary]').forEach(b=>b.onclick=()=>{product.primaryImage=+b.dataset.primary;setDirty();renderEditor()})}
function renderVariants(){const box=$('options');box.innerHTML=(product.variants.options||[]).map((o,oi)=>`<div class="option"><div class="option-head"><input value="${o.name}" data-oname="${oi}"><button class="icon" data-odel="${oi}">×</button></div>${o.values.map((v,vi)=>`<div class="value-row"><input value="${v}" data-value="${oi}:${vi}"><button class="icon" data-vdel="${oi}:${vi}">×</button></div>`).join('')}<button class="outline" data-vadd="${oi}" style="margin-top:8px">＋ Add value</button></div>`).join('');box.querySelectorAll('[data-oname]').forEach(x=>x.oninput=()=>{product.variants.options[+x.dataset.oname].name=x.value;setDirty()});box.querySelectorAll('[data-value]').forEach(x=>x.oninput=()=>{const [a,b]=x.dataset.value.split(':');product.variants.options[a].values[b]=x.value;setDirty()});box.querySelectorAll('[data-odel]').forEach(x=>x.onclick=()=>{product.variants.options.splice(+x.dataset.odel,1);setDirty();renderEditor()});box.querySelectorAll('[data-vdel]').forEach(x=>x.onclick=()=>{const[a,b]=x.dataset.vdel.split(':');product.variants.options[a].values.splice(b,1);setDirty();renderEditor()});box.querySelectorAll('[data-vadd]').forEach(x=>x.onclick=()=>{product.variants.options[+x.dataset.vadd].values.push('New value');setDirty();renderEditor()});$('addOption').onclick=()=>{product.variants.options.push({name:'Size',values:['Small','Medium']});setDirty();renderEditor()};$('regen').onclick=()=>{generateVariants();renderEditor()};const vals=product.variants.items||[];$('variants').innerHTML=vals.length?`<table><thead><tr><th>Variant</th><th>Price</th><th>SKU</th><th>Qty</th></tr></thead><tbody>${vals.map((v,i)=>`<tr><td>${Object.values(v.values).join(' / ')}</td><td><input data-vi="${i}:price" value="${v.price??product.price}"></td><td><input data-vi="${i}:sku" value="${v.sku||''}"></td><td><input data-vi="${i}:quantity" value="${v.quantity??0}"></td></tr>`).join('')}</tbody></table>`:'<p class="help">Generate combinations after adding options.</p>';document.querySelectorAll('[data-vi]').forEach(x=>x.oninput=()=>{const[a,key]=x.dataset.vi.split(':');product.variants.items[a][key]=key==='quantity'||key==='price'?Number(x.value):x.value;setDirty()})}
function generateVariants(){const opts=product.variants.options.filter(o=>o.name&&o.values.length);let combos=[{}];opts.forEach(o=>{combos=combos.flatMap(c=>o.values.map(v=>({...c,[o.name]:v}))) });const old=product.variants.items||[];product.variants.items=combos.map(values=>{const prior=old.find(v=>JSON.stringify(v.values)===JSON.stringify(values));return prior||{id:crypto.randomUUID(),values,price:product.price,sku:product.sku,quantity:0,image:''}})}
function renderPreview(){ $('topName').textContent=product.name||'Untitled product';$('previewName').textContent=product.name||'Untitled product';$('previewSub').textContent=product.subtitle||'';$('previewDesc').textContent=product.description||'';$('previewPrice').innerHTML=`$${Number(product.price||0).toFixed(2)}${product.compareAtPrice?`<span class="compare">$${Number(product.compareAtPrice).toFixed(2)}</span>`:''}`;$('statusBadge').textContent=product.status;$('statusBadge').className='badge '+product.status.toLowerCase();const imgs=product.images||[];imageIndex=Math.min(imageIndex,Math.max(0,imgs.length-1));$('hero').innerHTML=imgs.length?`<img src="${imgs[imageIndex]}" alt="${product.name}">`:'<div class="empty">Add product images to preview</div>';$('dots').innerHTML=imgs.map((_,i)=>`<i class="dot ${i===imageIndex?'on':''}"></i>`).join('');$('previewOptions').innerHTML=(product.variants.options||[]).map(o=>`<div class="option-title">${o.name}</div><div class="swatches">${o.values.map(v=>`<button class="swatch">${v}</button>`).join('')}</div>`).join('');document.querySelectorAll('.swatch').forEach(x=>x.onclick=()=>{document.querySelectorAll('.swatch').forEach(y=>y.classList.remove('selected'));x.classList.add('selected')});if($('seoPrevTitle')){$('seoPrevTitle').textContent=product.seo.title||product.name;$('seoPrevDesc').textContent=product.seo.description||product.description}}
async function save(){clearTimeout(timer);$('saveState').textContent='Saving…';$('saveState').className='save-state saving';try{product.updatedAt=new Date().toISOString();const ix=products.findIndex(x=>x.id===product.id);if(ix<0)products.unshift(product);else products[ix]=product;localStorage.setItem(KEY,JSON.stringify(products));if(window.Orbi9Catalog?.saveProducts)window.Orbi9Catalog.saveProducts(products);renderProductBrowser($('productSearch')?.value||'');dirty=false;$('saveState').textContent=`Saved at ${new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}`;$('saveState').className='save-state saved'}catch(e){$('saveState').textContent='Save failed';$('saveState').className='save-state failed'}}
$('prev').onclick=()=>{if(product.images.length){imageIndex=(imageIndex+product.images.length-1)%product.images.length;renderPreview()}};$('next').onclick=()=>{if(product.images.length){imageIndex=(imageIndex+1)%product.images.length;renderPreview()}};$('saveBtn').onclick=save;$('deleteBtn').onclick=deleteProduct;$('cancelBtn').onclick=()=>{if(!dirty||confirm('Discard unsaved changes?')){load();renderProductBrowser();renderPreview();renderEditor();dirty=false;$('saveState').textContent='Saved'}};const hashPassword=async value=>{if(window.crypto?.subtle){const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(value));return [...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,'0')).join('')}return value==='@lpha41Beta'?AUTH_HASH:''};$('auth-form').onsubmit=async e=>{e.preventDefault();const hex=await hashPassword($('pass').value);if($('user').value.trim().toLowerCase()===AUTH_USER&&hex===AUTH_HASH){sessionStorage.setItem('orbi9-admin-auth','1');start()}else $('auth-error').textContent='Username or password is incorrect.'};function start(){$('login').hidden=true;$('app').hidden=false;load();renderProductBrowser();renderNav();renderEditor();renderPreview()}if(sessionStorage.getItem('orbi9-admin-auth')==='1')start();
</script></body></html>
