<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORBI9 Catalogue Manager</title><style>
:root{font-family:Arial,sans-serif;color:#efe8da;background:#151515}*{box-sizing:border-box}body{margin:0}header{padding:28px 5vw;border-bottom:1px solid #403a31;display:flex;justify-content:space-between;align-items:center}header a{color:#d9a95b}.auth-gate{max-width:460px;margin:14vh auto;padding:32px;background:#211f1c;border:1px solid #403a31}.auth-gate h1{margin-top:0}.auth-error{color:#e59b8d;min-height:20px}.wrap{max-width:1180px;margin:0 auto;padding:40px 5vw}.layout{display:grid;grid-template-columns:360px 1fr;gap:28px}.panel{background:#211f1c;border:1px solid #403a31;padding:24px}h1,h2{font-weight:500}label{display:block;margin:14px 0 6px;color:#cdb98e;font-size:13px;text-transform:uppercase;letter-spacing:.08em}input,textarea{width:100%;padding:11px;background:#111;color:#fff;border:1px solid #554a3c}textarea{min-height:110px;resize:vertical}button{padding:11px 16px;border:1px solid #c2934b;background:#c2934b;color:#17120d;cursor:pointer;font-weight:bold}button.secondary{background:transparent;color:#e6c68f}.actions{display:flex;gap:10px;margin-top:18px}.status{min-height:20px;color:#a9d6a1}.muted{color:#998f80}.product-row{display:grid;grid-template-columns:64px 1fr auto;gap:15px;align-items:center;padding:15px 0;border-bottom:1px solid #403a31}.product-row img{width:64px;height:64px;object-fit:contain;background:#111}.image-preview{display:block;width:100%;max-height:180px;object-fit:contain;background:#111;margin-top:10px}.category-tools{border-top:1px solid #403a31;margin-top:24px;padding-top:18px}.category-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.category-chip{border:1px solid #554a3c;padding:6px 9px;color:#e6c68f;cursor:pointer;background:transparent}.product-row h3{margin:0 0 5px}.product-actions{display:flex;gap:8px}.empty{color:#998f80;padding:24px 0}@media(max-width:800px){.layout{grid-template-columns:1fr}.product-row{grid-template-columns:52px 1fr}.product-actions{grid-column:2}}
</style></head><body><header><strong>ORBI9 / CATALOGUE MANAGER</strong><a href="/">View storefront →</a></header><main id="auth-gate" class="auth-gate"><h1>Admin sign in</h1><p class="muted">Sign in to manage the Orbi9 catalogue.</p><form id="auth-form"><label for="auth-user">Username</label><input id="auth-user" autocomplete="username" required><label for="auth-pass">Password</label><input id="auth-pass" type="password" autocomplete="current-password" required><div class="actions"><button type="submit">Sign in</button></div><p id="auth-error" class="auth-error" role="alert"></p></form></main><main id="admin-app" class="wrap" hidden><p class="muted">A WordPress-like editing workspace for the standalone Orbi9 site. Changes are saved in this browser.</p><div class="layout"><section class="panel"><h2 id="form-title">Add product</h2><form id="product-form"><input id="product-id" type="hidden"><label for="name">Product name</label><input id="name" required maxlength="120"><label for="category">Category</label><input id="category" list="category-options" required maxlength="80" placeholder="Choose or create a category"><datalist id="category-options"></datalist><label for="price">Price (USD)</label><input id="price" required type="number" min="0" step="0.01"><label for="image_url">Image URL</label><input id="image_url" type="url" placeholder="/orbi9newlogo.png"><label for="image_file">Or upload from computer</label><input id="image_file" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><img id="image-preview" class="image-preview" alt="Image preview" hidden><label for="description">Description</label><textarea id="description" maxlength="1000"></textarea><div class="actions"><button type="submit">Save product</button><button class="secondary" id="cancel" type="button" hidden>Cancel</button></div><p id="status" class="status" role="status"></p></form><div class="category-tools"><h3>Categories</h3><p class="muted">Create a category here or click one to search products.</p><input id="new-category" placeholder="New category name"><div class="actions"><button id="add-category" type="button">Create category</button></div><div id="category-list" class="category-list"></div></div></section><section class="panel"><h2>Products <span id="count" class="muted"></span></h2><label for="product-search">Search products or categories</label><input id="product-search" placeholder="Type to filter the catalogue"><div id="products"></div></section></div></main><script src="/catalog.js"></script><script>
const AUTH_HASH='fec777c20ec60f25eb5953ee5bc9a2d275e627a691a980b152a828478d17542f';
const authGate=document.getElementById('auth-gate'),adminApp=document.getElementById('admin-app'),authForm=document.getElementById('auth-form');
const sha256=async value=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(value)))).map(b=>b.toString(16).padStart(2,'0')).join('');
function showAdmin(){authGate.hidden=true;adminApp.hidden=false;}
if(sessionStorage.getItem('orbi9-admin-auth')==='1')showAdmin();
authForm.addEventListener('submit',async e=>{e.preventDefault();const user=document.getElementById('auth-user').value.trim();const pass=document.getElementById('auth-pass').value;const valid=user==='Hackman'&&await sha256(pass)===AUTH_HASH;if(valid){sessionStorage.setItem('orbi9-admin-auth','1');showAdmin();}else{document.getElementById('auth-error').textContent='Username or password is incorrect.';}});
const api=window.Orbi9Catalog, $=id=>document.getElementById(id), form=$('product-form');
let categories=JSON.parse(localStorage.getItem('orbi9-categories-v1')||'[]');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let products=api.getProducts();
function syncCategories(){categories=[...new Set([...categories,...products.map(p=>p.category).filter(Boolean)])].sort((a,b)=>a.localeCompare(b));localStorage.setItem('orbi9-categories-v1',JSON.stringify(categories));$('category-options').innerHTML=categories.map(c=>`<option value="${esc(c)}">`).join('');$('category-list').innerHTML=categories.map(c=>`<button class="category-chip" type="button" data-category="${esc(c)}">${esc(c)}</button>`).join('');}
function draw(){ syncCategories(); const query=($('product-search').value||'').toLowerCase().trim(); const visible=products.filter(p=>!query||`${p.name} ${p.category} ${p.description||''}`.toLowerCase().includes(query)); $('count').textContent=`(${visible.length}/${products.length})`; $('products').innerHTML=visible.length?visible.map(p=>`<article class="product-row"><img src="${esc(p.image_url||'/orbi9newlogo.png')}" alt=""><div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.category)} · $${Number(p.price||0).toFixed(2)}</div></div><div class="product-actions"><button class="secondary" data-edit="${p.id}">Edit</button><button class="secondary" data-delete="${p.id}">Remove</button></div></article>`).join(''):'<p class="empty">No products yet. Add your first product.</p>'; }
function reset(){form.reset();$('product-id').value='';$('form-title').textContent='Add product';$('cancel').hidden=true;}
form.addEventListener('submit',e=>{e.preventDefault();const id=$('product-id').value||`orb-${Date.now()}`, item={id,name:$('name').value.trim(),slug:api.slugify($('name').value),category:$('category').value.trim(),price:Number($('price').value),image_url:$('image_url').value.trim(),description:$('description').value.trim()};const i=products.findIndex(p=>p.id===id);if(i<0)products.push(item);else products[i]=item;api.saveProducts(products);draw();reset();$('status').textContent='Saved. Refresh the storefront to see the change.';});
$('image_file').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{$('image_url').value=reader.result;$('image-preview').src=reader.result;$('image-preview').hidden=false;};reader.readAsDataURL(file);});
$('product-search').addEventListener('input',draw);
$('add-category').onclick=()=>{const category=$('new-category').value.trim();if(!category)return;if(!categories.some(c=>c.toLowerCase()===category.toLowerCase()))categories.push(category);localStorage.setItem('orbi9-categories-v1',JSON.stringify(categories));$('new-category').value='';syncCategories();$('category').value=category;};
$('category-list').addEventListener('click',e=>{if(e.target.dataset.category){$('product-search').value=e.target.dataset.category;draw();}});
$('products').addEventListener('click',e=>{const id=e.target.dataset.edit||e.target.dataset.delete;if(!id)return;const p=products.find(x=>x.id===id);if(e.target.dataset.delete){if(confirm(`Remove ${p.name}?`)){products=products.filter(x=>x.id!==id);api.saveProducts(products);draw();}}else{$('product-id').value=p.id;$('name').value=p.name;$('category').value=p.category;$('price').value=p.price;$('image_url').value=p.image_url||'';$('description').value=p.description||'';$('form-title').textContent='Edit product';$('cancel').hidden=false;window.scrollTo({top:0,behavior:'smooth'});}});$('cancel').onclick=reset;draw();
</script></body></html>
