<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORBI9 · Admin</title>
  <style>
    :root { color-scheme: dark; --bg:#101214; --panel:#191c20; --line:#343941; --ink:#f2eee5; --muted:#9da3ab; --accent:#d8b46a; --danger:#e98282; }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font:15px/1.5 Inter,system-ui,sans-serif }
    .shell { max-width:1180px; margin:auto; padding:32px 22px 60px } header { display:flex; align-items:center; justify-content:space-between; gap:20px; border-bottom:1px solid var(--line); padding-bottom:22px; margin-bottom:28px }
    h1,h2 { font-family:Georgia,serif; font-weight:400; letter-spacing:.03em } h1 { margin:0; font-size:32px } h2 { margin-top:0 } .eyebrow { color:var(--accent); text-transform:uppercase; letter-spacing:.14em; font-size:11px }
    button { border:1px solid var(--line); background:#252a30; color:var(--ink); border-radius:4px; padding:10px 14px; cursor:pointer } button:hover { border-color:var(--accent) } .primary { background:var(--accent); color:#191510; border-color:var(--accent); font-weight:700 }
    .grid { display:grid; grid-template-columns:minmax(280px,360px) 1fr; gap:22px } .card { background:var(--panel); border:1px solid var(--line); padding:22px; border-radius:6px } label { display:block; color:var(--muted); font-size:12px; margin:13px 0 5px } input,textarea,select { width:100%; background:#101216; color:var(--ink); border:1px solid var(--line); border-radius:4px; padding:11px } textarea { min-height:90px; resize:vertical } .actions { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap } .status { min-height:24px; color:var(--muted); margin:12px 0 0 } .status.error { color:var(--danger) } .status.ok { color:#9ed69b }
    table { width:100%; border-collapse:collapse } th,td { text-align:left; border-bottom:1px solid var(--line); padding:12px 8px; vertical-align:top } th { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.1em } .muted { color:var(--muted) } .row-actions { display:flex; gap:7px; flex-wrap:wrap } .danger { color:var(--danger) } .hidden { display:none !important } .auth { max-width:420px; margin:10vh auto } .signed-in { color:var(--muted); font-size:13px }
    @media(max-width:760px) { .grid { grid-template-columns:1fr } header { align-items:flex-start; flex-direction:column } th:nth-child(3),td:nth-child(3) { display:none } }
  </style>
</head>
<body>
  <main class="shell">
    <section id="auth-view" class="card auth">
      <div class="eyebrow">ORBI9 · Private archive</div><h1>Admin access</h1>
      <p class="muted">Sign in with an authorized Supabase account to manage the catalogue.</p>
      <form id="login-form"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><div class="actions"><button class="primary" type="submit">Sign in</button></div></form>
      <p id="auth-status" class="status" role="status"></p>
    </section>
    <section id="app-view" class="hidden">
      <header><div><div class="eyebrow">ORBI9 · Archive console</div><h1>Catalogue</h1><div class="signed-in" id="signed-in"></div></div><button id="logout">Sign out</button></header>
      <div class="grid"><section class="card"><h2 id="form-title">New object</h2><form id="product-form"><input id="product-id" type="hidden"><label for="name">Name</label><input id="name" required maxlength="120"><label for="category">Category</label><input id="category" required maxlength="80"><label for="price">Price (USD)</label><input id="price" type="number" min="0" step="0.01" required><label for="image_url">Image URL</label><input id="image_url" type="url" placeholder="https://…"><label for="description">Description</label><textarea id="description" maxlength="1000"></textarea><div class="actions"><button class="primary" type="submit">Save object</button><button id="cancel-edit" type="button" class="hidden">Cancel edit</button></div></form><p id="form-status" class="status" role="status"></p></section>
        <section class="card"><h2>Objects</h2><p id="list-status" class="status" role="status">Loading…</p><div style="overflow:auto"><table><thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Actions</th></tr></thead><tbody id="product-list"></tbody></table></div></section></div>
    </section>
  </main>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const url = import.meta.env.VITE_SUPABASE_URL;
    const publishableKey = import.meta.env.VITE_SUPABASE_PUBLISHABLE_KEY;
    const $ = (id) => document.getElementById(id);
    const supabase = createClient(url, publishableKey);
    const state = { products: [] };
    const setStatus = (id, text, type='') => { $(id).textContent = text; $(id).className = `status ${type}`; };
    const resetForm = () => { $('product-form').reset(); $('product-id').value=''; $('form-title').textContent='New object'; $('cancel-edit').classList.add('hidden'); };
    const render = () => { $('product-list').innerHTML = state.products.map(p => `<tr><td><strong>${escapeHtml(p.name)}</strong><br><span class="muted">${escapeHtml(p.description || '')}</span></td><td>${escapeHtml(p.category)}</td><td>$${Number(p.price).toFixed(2)}</td><td><div class="row-actions"><button data-edit="${p.id}">Edit</button><button class="danger" data-delete="${p.id}">Delete</button></div></td></tr>`).join(''); };
    const escapeHtml = (s='') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    async function loadProducts() { setStatus('list-status','Loading…'); const { data, error } = await supabase.from('products').select('*').order('created_at',{ascending:false}); if(error) return setStatus('list-status', error.message, 'error'); state.products=data || []; render(); setStatus('list-status', state.products.length ? `${state.products.length} object${state.products.length===1?'':'s'}` : 'No objects yet.'); }
    function fillForm(p) { $('product-id').value=p.id; $('name').value=p.name; $('category').value=p.category; $('price').value=p.price; $('image_url').value=p.image_url || ''; $('description').value=p.description || ''; $('form-title').textContent='Edit object'; $('cancel-edit').classList.remove('hidden'); window.scrollTo({top:0,behavior:'smooth'}); }
    $('login-form').addEventListener('submit', async e => { e.preventDefault(); setStatus('auth-status','Signing in…'); const { error }=await supabase.auth.signInWithPassword({email:$('email').value,password:$('password').value}); if(error) return setStatus('auth-status',error.message,'error'); $('login-form').reset(); showApp(); });
    $('logout').addEventListener('click', async () => { await supabase.auth.signOut(); showAuth(); }); $('cancel-edit').addEventListener('click',resetForm);
    $('product-form').addEventListener('submit', async e => { e.preventDefault(); const id=$('product-id').value; const product={name:$('name').value.trim(),category:$('category').value.trim(),price:Number($('price').value),image_url:$('image_url').value.trim()||null,description:$('description').value.trim()||null}; const result=id ? await supabase.from('products').update(product).eq('id',id) : await supabase.from('products').insert(product); if(result.error) return setStatus('form-status',result.error.message,'error'); setStatus('form-status',id?'Updated.':'Created.','ok'); resetForm(); loadProducts(); });
    $('product-list').addEventListener('click', async e => { const edit=e.target.closest('[data-edit]'); const del=e.target.closest('[data-delete]'); if(edit) fillForm(state.products.find(p=>String(p.id)===edit.dataset.edit)); if(del && confirm('Delete this object?')) { const {error}=await supabase.from('products').delete().eq('id',del.dataset.delete); if(error) setStatus('list-status',error.message,'error'); else loadProducts(); } });
    function showAuth(){ $('auth-view').classList.remove('hidden'); $('app-view').classList.add('hidden'); } async function showApp(){ $('auth-view').classList.add('hidden'); $('app-view').classList.remove('hidden'); $('signed-in').textContent=`Signed in as ${supabase.auth.getUser ? (await supabase.auth.getUser()).data.user?.email || '' : ''}`; loadProducts(); }
    supabase.auth.onAuthStateChange((_event, session) => session ? showApp() : showAuth()); (async () => { const { data:{session} }=await supabase.auth.getSession(); session ? showApp() : showAuth(); })();
  </script>
</body>
</html>
