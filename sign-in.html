<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — Orbi9</title><style>body{margin:0;background:#071326;color:#e9fbff;font:16px Arial;display:grid;place-items:center;min-height:100vh}.panel{width:min(420px,calc(100% - 40px));padding:32px;background:#0b1622;border:1px solid #17617b;box-shadow:0 0 28px #18cfff22}h1{color:#18cfff}label{display:block;margin:18px 0 6px}input{box-sizing:border-box;width:100%;padding:12px;background:#071326;border:1px solid #17617b;color:#fff}button{margin-top:22px;padding:12px 20px;background:#18cfff;border:0;color:#031018;font-weight:bold;cursor:pointer}.message{min-height:24px;color:#ff9b9b}a{color:#7de8ff}</style></head><body><main class="panel"><a href="/">← Orbi9</a><h1>Sign in</h1><form id="form"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>CONTINUE</button></form><p class="message" id="message"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script>const client=supabase.createClient(ORBI9_SUPABASE_CONFIG.url,ORBI9_SUPABASE_CONFIG.key);client.auth.getSession().then(({data})=>{if(data.session)location.replace('/account.html')});form.onsubmit=async e=>{e.preventDefault();message.textContent='Signing in…';const {error}=await client.auth.signInWithPassword({email:email.value,password:password.value});if(error)message.textContent=error.message;else location.replace('/account.html')};</script></body></html>
