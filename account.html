<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account settings — Orbi9</title><style>body{margin:0;background:#071326;color:#e9fbff;font:16px Arial;display:grid;place-items:center;min-height:100vh}.panel{width:min(520px,calc(100% - 40px));padding:32px;background:#0b1622;border:1px solid #17617b;box-shadow:0 0 28px #18cfff22}h1{color:#18cfff}button{padding:12px 20px;background:#18cfff;border:0;color:#031018;font-weight:bold;cursor:pointer}a{color:#7de8ff}</style></head><body><main class="panel"><a href="/">← Back to Orbi9</a><h1>Account settings</h1><p id="email">Checking your session…</p><button id="signout">SIGN OUT</button></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script>const client=supabase.createClient(ORBI9_SUPABASE_CONFIG.url,ORBI9_SUPABASE_CONFIG.key);client.auth.getSession().then(({data})=>{if(!data.session)location.replace('/sign-in.html');else email.textContent='Signed in as '+data.session.user.email});signout.onclick=async()=>{await client.auth.signOut();location.replace('/sign-in.html')};</script></body></html>
