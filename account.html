<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account info — Orbi9</title><style>body{margin:0;background:#071326;color:#e9fbff;font:16px Arial;min-height:100vh}.panel{width:min(760px,calc(100% - 40px));margin:40px auto;padding:32px;background:#0b1622;border:1px solid #17617b;box-shadow:0 0 28px #18cfff22}h1{color:#18cfff}h2{margin-top:32px;color:#7de8ff;font-size:18px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.stat{padding:18px;background:#071326;border:1px solid #17617b}.stat strong{display:block;font-size:28px;color:#fff;margin-top:7px}label{display:block;margin:14px 0 6px}input{box-sizing:border-box;width:100%;padding:12px;background:#071326;border:1px solid #17617b;color:#fff}button{padding:12px 20px;background:#18cfff;border:0;color:#031018;font-weight:bold;cursor:pointer;margin:18px 10px 0 0}.secondary{background:transparent;color:#7de8ff;border:1px solid #17617b}.message{min-height:22px;color:#7de8ff}a{color:#7de8ff}@media(max-width:520px){.panel{margin:20px auto;padding:22px}.stats{grid-template-columns:1fr}}</style></head><body><main class="panel"><a href="/">← Back to Orbi9</a><h1>Account info</h1><p id="welcome">Checking your account…</p><section><h2>Order summary</h2><div class="stats"><div class="stat">Total orders<strong id="orders">0</strong></div><div class="stat">Pending orders<strong id="pending">0</strong></div></div><p class="message">Order history will appear here after your first completed checkout.</p></section><section><h2>Personal information</h2><form id="profile"><label for="username">Username</label><input id="username" autocomplete="username" required><label for="email">Email</label><input id="email" type="email" readonly><h2>Shipping / mailing address</h2><label for="address">Street address</label><input id="address" autocomplete="street-address"><label for="city">City</label><input id="city" autocomplete="address-level2"><label for="postal">Postal code</label><input id="postal" autocomplete="postal-code"><label for="country">Country</label><input id="country" autocomplete="country-name"><button>SAVE ACCOUNT INFO</button><button type="button" class="secondary" id="signout">SIGN OUT</button></form><p class="message" id="message"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script>const client=supabase.createClient(ORBI9_SUPABASE_CONFIG.url,ORBI9_SUPABASE_CONFIG.key);let current;client.auth.getSession().then(({data})=>{current=data.session?.user;if(!current)return location.replace('/sign-in.html');const meta=current.user_metadata||{};email.value=current.email||'';username.value=meta.username||(current.email||'').split('@')[0];address.value=meta.shipping_address||'';city.value=meta.shipping_city||'';postal.value=meta.shipping_postal||'';country.value=meta.shipping_country||'';welcome.textContent='Signed in as '+current.email});profile.onsubmit=async e=>{e.preventDefault();message.textContent='Saving…';const {error}=await client.auth.updateUser({data:{username:username.value.trim(),shipping_address:address.value.trim(),shipping_city:city.value.trim(),shipping_postal:postal.value.trim(),shipping_country:country.value.trim()}});message.textContent=error?error.message:'Account info saved.'};signout.onclick=async()=>{await client.auth.signOut();location.replace('/sign-in.html')};</script></body></html>
