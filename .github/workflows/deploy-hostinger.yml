name: Deploy Orbi9 theme to Hostinger

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-theme:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate PHP theme files
        run: find Orbi9 -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate JavaScript
        run: node --check Orbi9/assets/js/Orbi9.js

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Verify the WordPress root
        env:
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          WP_ROOT: ${{ secrets.HOSTINGER_WP_ROOT }}
        run: |
          test -n "$HOST"
          test -n "$USER"
          test -n "$PORT"
          test -n "$WP_ROOT"
          case "$WP_ROOT" in /*) ;; *) echo 'HOSTINGER_WP_ROOT must be absolute'; exit 1 ;; esac
          SSH_OPTS="-p $PORT -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          REMOTE_ROOT=$(printf '%q' "$WP_ROOT")
          ssh $SSH_OPTS "$USER@$HOST" "test -f ${REMOTE_ROOT}/wp-load.php && test -d ${REMOTE_ROOT}/wp-content/themes"

      - name: Deploy only the Orbi9 theme
        env:
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          WP_ROOT: ${{ secrets.HOSTINGER_WP_ROOT }}
        run: |
          SSH_OPTS="ssh -p $PORT -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          rsync -az --itemize-changes \
            -e "$SSH_OPTS" \
            Orbi9/ "$USER@$HOST:$WP_ROOT/wp-content/themes/Orbi9/"
