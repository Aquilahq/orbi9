name: Validate ORB9 WordPress theme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate PHP theme files
        run: find Orbi9 -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate JavaScript
        run: node --check Orbi9/assets/js/Orbi9.js

      - name: Build installable theme package
        run: |
          zip -qr Orbi9.zip Orbi9
          unzip -t Orbi9.zip
