name: Validate ORB9 WordPress theme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate PHP theme files
        run: find orb9 -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate JavaScript
        run: node --check orb9/assets/js/orb9.js

      - name: Build installable theme package
        run: |
          zip -qr orb9.zip orb9
          unzip -t orb9.zip
