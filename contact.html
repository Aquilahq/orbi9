<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact ORBI9</title><style>
:root{--blue:#18cfff;--ink:#eef7ff;--muted:#a9c5d0;--bg:#050b12;--panel:#101b2b;--line:#2c7188}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,#102538 0,#050b12 42%);color:var(--ink);font:18px/1.6 system-ui,sans-serif}.wrap{max-width:980px;margin:auto;padding:0 24px}.header{border-bottom:1px solid var(--line);padding:22px 0}.header a{color:var(--ink);text-decoration:none}.logo{font-weight:900;letter-spacing:.18em;font-size:20px}.eyebrow{color:var(--blue);font-size:14px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}main{padding:70px 0}.form-card{max-width:700px;margin:auto;padding:34px;background:var(--panel);border:2px solid var(--blue);border-radius:12px;box-shadow:0 0 28px #18cfff33}h1{font-size:clamp(34px,6vw,58px);line-height:1.05;margin:8px 0 28px}form{display:grid;gap:20px}label{font-weight:750;font-size:19px}input,textarea{display:block;width:100%;margin-top:8px;padding:16px;border:2px solid var(--line);border-radius:6px;background:#071326;color:var(--ink);font:inherit}input:focus,textarea:focus{outline:3px solid #18cfff66;border-color:var(--blue)}button{padding:16px 24px;border:0;border-radius:6px;background:var(--blue);color:#03202b;font-size:18px;font-weight:850;cursor:pointer}.benefits{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:28px auto 0;max-width:900px}.benefit{padding:16px;text-align:center;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:15px}.benefit strong{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}.status{min-height:24px;color:var(--blue)}footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:14px}@media(max-width:700px){main{padding:38px 0}.form-card{padding:24px}.benefits{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header class="header"><div class="wrap"><a class="logo" href="/">ORBI9</a></div></header><main><div class="wrap"><section class="form-card"><div class="eyebrow">Contact ORBI9</div><h1>Send us a message</h1><form id="contact-form"><label>Your name<input name="name" required placeholder="Enter your name"></label><label>Your email<input name="email" type="email" required placeholder="you@example.com"></label><label>Your message<textarea name="message" required rows="7" placeholder="How can we help?"></textarea></label><button type="submit">SEND MESSAGE</button><div class="status" id="status" aria-live="polite"></div></form></section><section class="benefits" aria-label="Orbi9 promises"><div class="benefit"><strong>AUTHENTIC & ORIGINAL</strong>Every item reviewed.</div><div class="benefit"><strong>CAREFULLY CURATED</strong>Handpicked with history.</div><div class="benefit"><strong>SECURE SHIPPING</strong>Protection for your order.</div><div class="benefit"><strong>BUILT FOR COLLECTORS</strong>Made to be preserved.</div></section></div></main><footer><div class="wrap">© ORBI9 · <a href="/" style="color:inherit">Back to collection</a></div></footer><script>document.getElementById('contact-form').addEventListener('submit',event=>{event.preventDefault();const data=new FormData(event.currentTarget);const subject=encodeURIComponent(`Orbi9 contact from ${data.get('name')}`);const body=encodeURIComponent(`Name: ${data.get('name')}\nEmail: ${data.get('email')}\n\n${data.get('message')}`);document.getElementById('status').textContent='Opening your email app…';location.href=`mailto:archive@orbi9.com?subject=${subject}&body=${body}`;});</script></body></html>
